name: Despliegue de Capa de Base de Datos

on:
  push:
    branches: [ "deploy" ]
    paths:
      - "init-db/**"
      - "deployment/docker-compose.db.yml"
      - ".github/workflows/deploy-database.yml"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  deploy-db:
    name: Desplegar Base de Datos vía SSM
    runs-on: ubuntu-latest
    steps:
    - name: Descargar Código
      uses: actions/checkout@v4

    - name: Configurar Credenciales de AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Preparar Parámetros de SSM
      run: |
        cat <<EOF > parameters.json
        {
          "commands": [
            "sudo mkdir -p /opt/app/init",
            "sudo chmod -R 777 /opt/app",
            "cd /opt/app",
            "docker-compose down -v || true",
            "cat <<'SQL' > init/ventas.sql
            $(cat init-db/seed-ventas.sql)
            SQL",
            "cat <<'SQL' > init/despachos.sql
            $(cat init-db/seed-despachos.sql)
            SQL",
            "echo 'version: \"3.8\"' > docker-compose.yml",
            "echo 'services:' >> docker-compose.yml",
            "echo '  db-ventas:' >> docker-compose.yml",
            "echo '    image: mysql:8.0' >> docker-compose.yml",
            "echo '    container_name: db-ventas' >> docker-compose.yml",
            "echo '    restart: always' >> docker-compose.yml",
            "echo '    command: [\"--performance_schema=OFF\", \"--skip-name-resolve\"]' >> docker-compose.yml",
            "echo '    environment:' >> docker-compose.yml",
            "echo '      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}' >> docker-compose.yml",
            "echo '      MYSQL_DATABASE: ventas_db' >> docker-compose.yml",
            "echo '      MYSQL_USER: ${{ secrets.MYSQL_USER }}' >> docker-compose.yml",
            "echo '      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}' >> docker-compose.yml",
            "echo '      MYSQL_ROOT_HOST: \"%\"' >> docker-compose.yml",
            "echo '    ports:' >> docker-compose.yml",
            "echo '      - \"3306:3306\"' >> docker-compose.yml",
            "echo '    volumes:' >> docker-compose.yml",
            "echo '      - db_ventas_data:/var/lib/mysql' >> docker-compose.yml",
            "echo '      - ./init/ventas.sql:/docker-entrypoint-initdb.d/init.sql' >> docker-compose.yml",
            "echo '  db-despachos:' >> docker-compose.yml",
            "echo '    image: mysql:8.0' >> docker-compose.yml",
            "echo '    container_name: db-despachos' >> docker-compose.yml",
            "echo '    restart: always' >> docker-compose.yml",
            "echo '    command: [\"--performance_schema=OFF\", \"--skip-name-resolve\"]' >> docker-compose.yml",
            "echo '    environment:' >> docker-compose.yml",
            "echo '      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}' >> docker-compose.yml",
            "echo '      MYSQL_DATABASE: despachos_db' >> docker-compose.yml",
            "echo '      MYSQL_USER: ${{ secrets.MYSQL_USER }}' >> docker-compose.yml",
            "echo '      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}' >> docker-compose.yml",
            "echo '      MYSQL_ROOT_HOST: \"%\"' >> docker-compose.yml",
            "echo '    ports:' >> docker-compose.yml",
            "echo '      - \"3307:3306\"' >> docker-compose.yml",
            "echo '    volumes:' >> docker-compose.yml",
            "echo '      - db_despachos_data:/var/lib/mysql' >> docker-compose.yml",
            "echo '      - ./init/despachos.sql:/docker-entrypoint-initdb.d/init.sql' >> docker-compose.yml",
            "echo 'volumes:' >> docker-compose.yml",
            "echo '  db_ventas_data:' >> docker-compose.yml",
            "echo '  db_despachos_data:' >> docker-compose.yml",
            "docker-compose up -d",
            "sleep 30",
            "docker exec db-ventas mysql -u root -p${{ secrets.MYSQL_ROOT_PASSWORD }} -e \"CREATE USER IF NOT EXISTS 'root'@'10.0.%' IDENTIFIED BY '${{ secrets.MYSQL_ROOT_PASSWORD }}'; GRANT ALL PRIVILEGES ON *.* TO 'root'@'10.0.%' WITH GRANT OPTION; FLUSH PRIVILEGES;\"",
            "docker exec db-despachos mysql -u root -p${{ secrets.MYSQL_ROOT_PASSWORD }} -e \"CREATE USER IF NOT EXISTS 'root'@'10.0.%' IDENTIFIED BY '${{ secrets.MYSQL_ROOT_PASSWORD }}'; GRANT ALL PRIVILEGES ON *.* TO 'root'@'10.0.%' WITH GRANT OPTION; FLUSH PRIVILEGES;\""
          ]
        }
        EOF

    - name: Ejecutar Comando SSM
      run: |
        aws ssm send-command \
          --instance-ids ${{ secrets.EC2_DB_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --parameters file://parameters.json
