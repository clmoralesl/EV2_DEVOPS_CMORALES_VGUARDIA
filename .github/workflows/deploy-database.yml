name: Despliegue de Capa de Base de Datos

on:
  push:
    branches: [ "deploy" ]
    paths:
      - "init-db/**"
      - "deployment/docker-compose.db.yml"
      - ".github/workflows/deploy-database.yml"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  deploy-db:
    name: Desplegar Base de Datos vía SSM
    runs-on: ubuntu-latest
    steps:
    - name: Descargar Código
      uses: actions/checkout@v4

    - name: Configurar Credenciales de AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Preparar Parámetros de SSM
      run: |
        # Creamos el JSON de parámetros evitando saltos de línea problemáticos
        cat <<EOF > parameters.json
        {
          "commands": [
            "mkdir -p ~/app",
            "echo 'version: \"3.8\"' > ~/app/docker-compose.yml",
            "echo 'services:' >> ~/app/docker-compose.yml",
            "echo '  db-ventas:' >> ~/app/docker-compose.yml",
            "echo '    image: mysql:8.0' >> ~/app/docker-compose.yml",
            "echo '    container_name: db-ventas' >> ~/app/docker-compose.yml",
            "echo '    restart: always' >> ~/app/docker-compose.yml",
            "echo '    environment:' >> ~/app/docker-compose.yml",
            "echo '      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}' >> ~/app/docker-compose.yml",
            "echo '      MYSQL_DATABASE: ventas_db' >> ~/app/docker-compose.yml",
            "echo '      MYSQL_USER: ${{ secrets.MYSQL_USER }}' >> ~/app/docker-compose.yml",
            "echo '      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}' >> ~/app/docker-compose.yml",
            "echo '    ports:' >> ~/app/docker-compose.yml",
            "echo '      - \"3306:3306\"' >> ~/app/docker-compose.yml",
            "echo '    volumes:' >> ~/app/docker-compose.yml",
            "echo '      - db_ventas_data:/var/lib/mysql' >> ~/app/docker-compose.yml",
            "echo '  db-despachos:' >> ~/app/docker-compose.yml",
            "echo '    image: mysql:8.0' >> ~/app/docker-compose.yml",
            "echo '    container_name: db-despachos' >> ~/app/docker-compose.yml",
            "echo '    restart: always' >> ~/app/docker-compose.yml",
            "echo '    environment:' >> ~/app/docker-compose.yml",
            "echo '      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}' >> ~/app/docker-compose.yml",
            "echo '      MYSQL_DATABASE: despachos_db' >> ~/app/docker-compose.yml",
            "echo '      MYSQL_USER: ${{ secrets.MYSQL_USER }}' >> ~/app/docker-compose.yml",
            "echo '      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}' >> ~/app/docker-compose.yml",
            "echo '    ports:' >> ~/app/docker-compose.yml",
            "echo '      - \"3307:3306\"' >> ~/app/docker-compose.yml",
            "echo '    volumes:' >> ~/app/docker-compose.yml",
            "echo '      - db_despachos_data:/var/lib/mysql' >> ~/app/docker-compose.yml",
            "echo 'volumes:' >> ~/app/docker-compose.yml",
            "echo '  db_ventas_data:' >> ~/app/docker-compose.yml",
            "echo '  db_despachos_data:' >> ~/app/docker-compose.yml",
            "cd ~/app && docker-compose up -d"
          ]
        }
        EOF

    - name: Ejecutar Comando SSM
      run: |
        aws ssm send-command \
          --instance-ids ${{ secrets.EC2_DB_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --parameters file://parameters.json
