name: Despliegue de Capa de Frontend

on:
  push:
    branches: [ "deploy" ]
    paths:
      - "front_despacho/**"
      - "deployment/docker-compose.front.yml"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  build-and-push:
    name: Construir y Subir Frontend a ECR
    runs-on: ubuntu-latest
    steps:
    - name: Descargar Código
      uses: actions/checkout@v4

    - name: Configurar Credenciales de AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Iniciar Sesión en Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Construir y Subir Imagen
      run: |
        REGISTRY=${{ steps.login-ecr.outputs.registry }}
        docker build -t $REGISTRY/proyecto-frontend:latest ./front_despacho
        docker push $REGISTRY/proyecto-frontend:latest

  deploy:
    name: Desplegar Frontend vía SSM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Configurar Credenciales de AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Preparar Parámetros de SSM
      run: |
        cat <<EOF > parameters.json
        {
          "commands": [
            "sudo mkdir -p /opt/app",
            "sudo chmod 777 /opt/app",
            "cd /opt/app",
            "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com",
            "docker-compose down || true",
            "echo 'version: \"3.8\"' > docker-compose.yml",
            "echo 'services:' >> docker-compose.yml",
            "echo '  front-despacho:' >> docker-compose.yml",
            "echo '    image: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/proyecto-frontend:latest' >> docker-compose.yml",
            "echo '    container_name: front-despacho' >> docker-compose.yml",
            "echo '    restart: always' >> docker-compose.yml",
            "echo '    ports:' >> docker-compose.yml",
            "echo '      - \"80:80\"' >> docker-compose.yml",
            "echo '    volumes:' >> docker-compose.yml",
            "echo '      - ./nginx.conf:/etc/nginx/conf.d/default.conf' >> docker-compose.yml",
            "echo 'server {' > nginx.conf",
            "echo '    listen 80;' >> nginx.conf",
            "echo '    server_name localhost;' >> nginx.conf",
            "echo '    resolver 8.8.8.8 valid=30s;' >> nginx.conf",
            "echo '    location / {' >> nginx.conf",
            "echo '        root /usr/share/nginx/html;' >> nginx.conf",
            "echo '        index index.html index.htm;' >> nginx.conf",
            "echo '        try_files \$uri \$uri/ /index.html;' >> nginx.conf",
            "echo '    }' >> nginx.conf",
            "echo '    location /api/v1/ventas {' >> nginx.conf",
            "echo '        proxy_pass http://${{ secrets.BACK_PRIVATE_IP }}:8080;' >> nginx.conf",
            "echo '        proxy_set_header Host \$host;' >> nginx.conf",
            "echo '        proxy_set_header X-Real-IP \$remote_addr;' >> nginx.conf",
            "echo '    }' >> nginx.conf",
            "echo '    location /api/v1/despachos {' >> nginx.conf",
            "echo '        proxy_pass http://${{ secrets.BACK_PRIVATE_IP }}:8081;' >> nginx.conf",
            "echo '        proxy_set_header Host \$host;' >> nginx.conf",
            "echo '        proxy_set_header X-Real-IP \$remote_addr;' >> nginx.conf",
            "echo '    }' >> nginx.conf",
            "echo '    location /img-proxy/apple {' >> nginx.conf",
            "echo '        proxy_ssl_server_name on;' >> nginx.conf",
            "echo '        proxy_pass https://seeklogo.com/images/A/apple-logo-E3DBF3AE34-seeklogo.com.png;' >> nginx.conf",
            "echo '        proxy_set_header Referer \"\";' >> nginx.conf",
            "echo '    }' >> nginx.conf",
            "echo '    location /img-proxy/hyperx {' >> nginx.conf",
            "echo '        proxy_ssl_server_name on;' >> nginx.conf",
            "echo '        proxy_pass https://seeklogo.com/images/H/hyper-x-logo-C4B6774A38-seeklogo.com.png;' >> nginx.conf",
            "echo '        proxy_set_header Referer \"\";' >> nginx.conf",
            "echo '    }' >> nginx.conf",
            "echo '    location /img-proxy/logitech {' >> nginx.conf",
            "echo '        proxy_ssl_server_name on;' >> nginx.conf",
            "echo '        proxy_pass https://seeklogo.com/images/L/logitech-gaming-logo-B76FC713B0-seeklogo.com.png;' >> nginx.conf",
            "echo '        proxy_set_header Referer \"\";' >> nginx.conf",
            "echo '    }' >> nginx.conf",
            "echo '}' >> nginx.conf",
            "docker-compose pull && docker-compose up -d"
          ]
        }
        EOF

    - name: Ejecutar Comando SSM
      run: |
        aws ssm send-command \
          --instance-ids ${{ secrets.EC2_FRONT_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --parameters file://parameters.json
