name: CI/CD Pipeline - EP2 Deployment

on:
  push:
    branches: [ "deploy" ]

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # 1. Build & Push Frontend
    - name: Build, tag, and push Frontend
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: proyecto-frontend
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} ./front_despacho
        docker push $ECR_REGISTRY/$ECR_REPOSITORY --all-tags

    # 2. Build & Push Back-Ventas
    - name: Build, tag, and push Back-Ventas
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: proyecto-back-ventas
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} ./back-Ventas_SpringBoot/Springboot-API-REST
        docker push $ECR_REGISTRY/$ECR_REPOSITORY --all-tags

    # 3. Build & Push Back-Despachos
    - name: Build, tag, and push Back-Despachos
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: proyecto-back-despachos
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
        docker push $ECR_REGISTRY/$ECR_REPOSITORY --all-tags

  deploy:
    name: Deploy to EC2 Instances
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

    # --- DEPLOY DATABASE TIER ---
    - name: Deploy Databases
      env:
        HOST: ${{ secrets.DB_PUBLIC_IP }}
      run: |
        ssh -o StrictHostKeyChecking=no ec2-user@$HOST "mkdir -p ~/app/init-db"
        scp -o StrictHostKeyChecking=no deployment/docker-compose.db.yml ec2-user@$HOST:~/app/docker-compose.yml
        scp -o StrictHostKeyChecking=no init-db/*.sql ec2-user@$HOST:~/app/init-db/
        ssh -o StrictHostKeyChecking=no ec2-user@$HOST "cd ~/app && \
          export MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }} && \
          export MYSQL_USER=${{ secrets.MYSQL_USER }} && \
          export MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }} && \
          docker-compose down && docker-compose up -d"

    # --- DEPLOY BACKEND TIER ---
    - name: Deploy Backends
      env:
        HOST: ${{ secrets.BACK_PUBLIC_IP }}
      run: |
        scp -o StrictHostKeyChecking=no deployment/docker-compose.back.yml ec2-user@$HOST:~/app/docker-compose.yml
        ssh -o StrictHostKeyChecking=no ec2-user@$HOST "cd ~/app && \
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com && \
          export AWS_ACCOUNT_ID=${{ env.AWS_ACCOUNT_ID }} && \
          export AWS_REGION=${{ env.AWS_REGION }} && \
          export DB_PRIVATE_IP=${{ secrets.DB_PRIVATE_IP }} && \
          export MYSQL_USER=${{ secrets.MYSQL_USER }} && \
          export MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }} && \
          docker-compose pull && docker-compose up -d"

    # --- DEPLOY FRONTEND TIER ---
    - name: Deploy Frontend
      env:
        HOST: ${{ secrets.FRONT_PUBLIC_IP }}
      run: |
        scp -o StrictHostKeyChecking=no deployment/docker-compose.front.yml ec2-user@$HOST:~/app/docker-compose.yml
        ssh -o StrictHostKeyChecking=no ec2-user@$HOST "cd ~/app && \
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com && \
          export AWS_ACCOUNT_ID=${{ env.AWS_ACCOUNT_ID }} && \
          export AWS_REGION=${{ env.AWS_REGION }} && \
          export BACK_PRIVATE_IP=${{ secrets.BACK_PRIVATE_IP }} && \
          docker-compose pull && docker-compose up -d"
