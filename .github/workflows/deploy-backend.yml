name: Despliegue de Capa de Backend

on:
  push:
    branches: [ "deploy" ]
    paths:
      - "back-Ventas_SpringBoot/**"
      - "back-Despachos_SpringBoot/**"
      - "deployment/docker-compose.back.yml"
      - ".github/workflows/deploy-backend.yml"

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  build-and-push:
    name: Construir y Subir Backends a ECR
    runs-on: ubuntu-latest
    steps:
    - name: Descargar Código
      uses: actions/checkout@v4

    - name: Configurar Credenciales de AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Iniciar Sesión en Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Construir y Subir Imágenes
      run: |
        REGISTRY=${{ steps.login-ecr.outputs.registry }}
        docker build -t $REGISTRY/proyecto-back-ventas:latest ./back-Ventas_SpringBoot/Springboot-API-REST
        docker push $REGISTRY/proyecto-back-ventas:latest
        docker build -t $REGISTRY/proyecto-back-despachos:latest ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
        docker push $REGISTRY/proyecto-back-despachos:latest

  deploy:
    name: Desplegar Backends vía SSM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Configurar Credenciales de AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Desplegar vía SSM
      run: |
        aws ssm send-command \
          --instance-ids ${{ secrets.EC2_BACK_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --parameters '{"commands":[
            "mkdir -p ~/app",
            "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com",
            "cat <<EOF > ~/app/docker-compose.yml
        version: \"3.8\"
        services:
          back-ventas:
            image: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/proyecto-back-ventas:latest
            container_name: back-ventas
            restart: always
            ports:
              - \"8080:8080\"
            environment:
              - DB_ENDPOINT=${{ secrets.DB_PRIVATE_IP }}
              - DB_PORT=3306
              - DB_NAME=ventas_db
              - DB_USERNAME=${{ secrets.MYSQL_USER }}
              - DB_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          back-despachos:
            image: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/proyecto-back-despachos:latest
            container_name: back-despachos
            restart: always
            ports:
              - \"8081:8081\"
            environment:
              - DB_ENDPOINT=${{ secrets.DB_PRIVATE_IP }}
              - DB_PORT=3307
              - DB_NAME=despachos_db
              - DB_USERNAME=${{ secrets.MYSQL_USER }}
              - DB_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
        EOF",
            "cd ~/app && docker-compose pull && docker-compose up -d"
          ]}'
