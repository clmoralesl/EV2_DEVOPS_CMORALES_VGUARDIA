name: Despliegue de Capa de Backend

on:
  push:
    branches: [ "deploy" ]
    paths:
      - "back-Ventas_SpringBoot/**"
      - "back-Despachos_SpringBoot/**"
      - "deployment/docker-compose.back.yml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  build-and-push:
    name: Construir y Subir Backends a ECR
    runs-on: ubuntu-latest
    steps:
    - name: Descargar Código
      uses: actions/checkout@v4

    - name: Configurar Credenciales de AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Iniciar Sesión en Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Construir y Subir Imágenes
      run: |
        REGISTRY=${{ steps.login-ecr.outputs.registry }}
        docker build -t $REGISTRY/proyecto-back-ventas:latest ./back-Ventas_SpringBoot/Springboot-API-REST
        docker push $REGISTRY/proyecto-back-ventas:latest
        docker build -t $REGISTRY/proyecto-back-despachos:latest ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
        docker push $REGISTRY/proyecto-back-despachos:latest

  deploy:
    name: Desplegar Backends vía SSM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Configurar Credenciales de AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Preparar Parámetros de SSM
      run: |
        cat <<EOF > parameters.json
        {
          "commands": [
            "mkdir -p ~/app",
            "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com",
            "echo 'version: \"3.8\"' > ~/app/docker-compose.yml",
            "echo 'services:' >> ~/app/docker-compose.yml",
            "echo '  back-ventas:' >> ~/app/docker-compose.yml",
            "echo '    image: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/proyecto-back-ventas:latest' >> ~/app/docker-compose.yml",
            "echo '    container_name: back-ventas' >> ~/app/docker-compose.yml",
            "echo '    restart: always' >> ~/app/docker-compose.yml",
            "echo '    ports:' >> ~/app/docker-compose.yml",
            "echo '      - \"8080:8080\"' >> ~/app/docker-compose.yml",
            "echo '    environment:' >> ~/app/docker-compose.yml",
            "echo '      - DB_ENDPOINT=${{ secrets.DB_PRIVATE_IP }}' >> ~/app/docker-compose.yml",
            "echo '      - DB_PORT=3306' >> ~/app/docker-compose.yml",
            "echo '      - DB_NAME=ventas_db' >> ~/app/docker-compose.yml",
            "echo '      - DB_USERNAME=${{ secrets.MYSQL_USER }}' >> ~/app/docker-compose.yml",
            "echo '      - DB_PASSWORD=${{ secrets.MYSQL_PASSWORD }}' >> ~/app/docker-compose.yml",
            "echo '  back-despachos:' >> ~/app/docker-compose.yml",
            "echo '    image: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/proyecto-back-despachos:latest' >> ~/app/docker-compose.yml",
            "echo '    container_name: back-despachos' >> ~/app/docker-compose.yml",
            "echo '    restart: always' >> ~/app/docker-compose.yml",
            "echo '    ports:' >> ~/app/docker-compose.yml",
            "echo '      - \"8081:8081\"' >> ~/app/docker-compose.yml",
            "echo '    environment:' >> ~/app/docker-compose.yml",
            "echo '      - DB_ENDPOINT=${{ secrets.DB_PRIVATE_IP }}' >> ~/app/docker-compose.yml",
            "echo '      - DB_PORT=3307' >> ~/app/docker-compose.yml",
            "echo '      - DB_NAME=despachos_db' >> ~/app/docker-compose.yml",
            "echo '      - DB_USERNAME=${{ secrets.MYSQL_USER }}' >> ~/app/docker-compose.yml",
            "echo '      - DB_PASSWORD=${{ secrets.MYSQL_PASSWORD }}' >> ~/app/docker-compose.yml",
            "cd ~/app && docker-compose pull && docker-compose up -d"
          ]
        }
        EOF

    - name: Ejecutar Comando SSM
      run: |
        aws ssm send-command \
          --instance-ids ${{ secrets.EC2_BACK_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --parameters file://parameters.json
