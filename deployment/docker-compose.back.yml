version: '3.8'

services:
  back-ventas:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/proyecto-back-ventas:latest
    container_name: back-ventas
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_ENDPOINT=${DB_PRIVATE_IP}
      - DB_PORT=3306
      - DB_NAME=ventas_db
      - DB_USERNAME=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}

  back-despachos:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/proyecto-back-despachos:latest
    container_name: back-despachos
    restart: always
    ports:
      - "8081:8081"
    environment:
      - DB_ENDPOINT=${DB_PRIVATE_IP}
      - DB_PORT=3307
      - DB_NAME=despachos_db
      - DB_USERNAME=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
