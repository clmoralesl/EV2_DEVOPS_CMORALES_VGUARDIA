version: '3.8'

services:
  db-ventas:
    image: mysql:8.0
    container_name: db-ventas
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ventas_db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_ventas_data:/var/lib/mysql
      - ./init-db/seed-ventas.sql:/docker-entrypoint-initdb.d/seed.sql

  db-despachos:
    image: mysql:8.0
    container_name: db-despachos
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: despachos_db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_despachos_data:/var/lib/mysql
      - ./init-db/seed-despachos.sql:/docker-entrypoint-initdb.d/seed.sql

volumes:
  db_ventas_data:
  db_despachos_data:
